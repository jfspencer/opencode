# The Rust port of opencode (see port/README.md). Crates live under crates/: the wire types (opencode-protocol), their
# round-trip harness (protocol-check) and the opencode executable (opencode).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
opencode-protocol = { path = "crates/opencode-protocol" }
opencode-codemode = { path = "crates/opencode-codemode" }
indexmap = "2"
ryu = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time", "sync", "macros", "signal", "io-util", "process"] }
hyper = { version = "1.11", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "0.1.3"
bytes = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
sha1 = "0.10"
base64 = "0.22"
getrandom = "0.4"
# The model client: TLS over rustls with ring (no C toolchain), trusting the platform roots and SSL_CERT_FILE.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8.4"
unicode-normalization = "0.1.25"
sha2 = "0.10.9"

[profile.dev]
# The generated crate is large; debug info for it is rarely useful and slows linking.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
