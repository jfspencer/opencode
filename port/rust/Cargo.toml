# The Rust port of opencode (see port/README.md). Crates live under crates/; the server, CLI and TUI crates
# will join opencode-protocol here.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
opencode-protocol = { path = "crates/opencode-protocol" }
indexmap = "2"
ryu = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

[profile.dev]
# The generated crate is large; debug info for it is rarely useful and slows linking.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
