[package]
name = "opencode"
description = "The opencode server, CLI and TUI, ported from the TS reference (see port/README.md)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opencode"
path = "src/main.rs"

[dependencies]
opencode-protocol.workspace = true
opencode-shell = { path = "../opencode-shell" }
opencode-html.workspace = true
# The JS engine's RegExp and Date.parse, as the reference runs them (form answers).
opencode-codemode = { path = "../opencode-codemode" }
url = "2.5"
indexmap.workspace = true
regex.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rusqlite.workspace = true
sha1.workspace = true
base64.workspace = true
getrandom.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
libc.workspace = true
# Image normalization as the reference runs it: photon-node 0.3.4's image 0.24.9 with the same formats (its codec
# versions are pinned in Cargo.lock: png 0.17.14, jpeg-decoder 0.3.1, gif 0.13.1, tiff 0.9.1, flate2 1.0.34,
# miniz_oxide 0.8.0, fdeflate 0.3.6, weezl 0.1.8).
image = { version = "=0.24.9", default-features = false, features = ["gif", "jpeg", "ico", "png", "pnm", "tga", "tiff", "webp", "bmp", "hdr", "dxt", "dds", "farbfeld"] }
# The WebAssembly build has no SIMD: the scalar IDCT and color conversion.
jpeg-decoder = { version = "=0.3.1", default-features = false, features = ["platform_independent"] }
# The wasm target's `sinf` (compiler-builtins' libm), for the Lanczos kernel.
libm = "0.2"
