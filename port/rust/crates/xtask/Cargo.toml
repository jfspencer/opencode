[package]
name = "xtask"
description = "Portable development tooling for the opencode Rust port (see port/README.md)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Archive extraction for the vendored grammars and OpenTUI sources. This crate is a dev tool and is never
# linked into the opencode executable.
flate2 = "1"
tar = "0.4"
# The grammar/vendor checksums.
sha2 = "0.10"
# port/coverage/out/lists.json (upstream-tests and coverage-run).
serde_json = "1"
