[package]
name = "opencode-tui"
description = "The opencode TUI (packages/tui), on opencode-tui-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
opencode-tui-core = { path = "../opencode-tui-core" }
opencode-tui-input = { path = "../opencode-tui-input" }
opencode-tui-text = { path = "../opencode-tui-text" }
opencode-tui-sync = { path = "../opencode-tui-sync" }
# ECMAScript regexes and UTF-16 strings (a form field's `pattern`), and the diff model.
opencode-tui-markup = { path = "../opencode-tui-markup" }
tokio.workspace = true
# JSON values with JS semantics (insertion order, JSON.parse/JSON.stringify): themes and cli.json.
opencode-protocol.workspace = true
indexmap.workspace = true
regex.workspace = true
# The CLI config lock (packages/util/src/flock.ts: sha1 lock names, random tokens, the host name).
sha1.workspace = true
getrandom.workspace = true
libc.workspace = true
# fuzzysort's accent removal (NFD of Latin runs).
unicode-normalization.workspace = true
# Pasted attachments as data: URIs.
base64.workspace = true
