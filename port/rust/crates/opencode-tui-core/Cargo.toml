[package]
name = "opencode-tui-core"
description = "OpenTUI 0.8.1 for the opencode TUI: cell buffer, diffed output, terminal session, renderables and a reactive layer with Solid's semantics"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
opencode-yoga = { path = "../opencode-yoga" }
opencode-tui-text = { path = "../opencode-tui-text" }
opencode-tui-input = { path = "../opencode-tui-input" }
# The content side of Markdown, Code, TextTable and Diff (the markdown model, highlighting, table layout, jsdiff).
opencode-tui-markup = { path = "../opencode-tui-markup" }
libc.workspace = true
tokio.workspace = true

[dev-dependencies]
# JSON cases for the renderables harness (examples/renderables.rs).
opencode-protocol.workspace = true

