[package]
name = "opencode-tui-markup"
description = "What OpenTUI's Markdown, Code, Diff and TextTable renderables compute: the marked lexer, the markdown block model, tree-sitter highlighting and conceal, diff parsing and table layout"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regress = { version = "=0.11.1", default-features = false, features = ["std", "utf16"] }
tree-sitter = "=0.25.10"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
